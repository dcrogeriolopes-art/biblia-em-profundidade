name: Gerar AAB da Play Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Bíblia em Profundidade
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Conferir arquivo do projeto
        shell: bash
        run: |
          test -f android-project.zip || {
            echo "::error::Envie o arquivo android-project.zip para a raiz do repositório antes de executar o workflow."
            exit 1
          }

      - name: Extrair projeto Android
        shell: bash
        run: |
          rm -rf android-src
          mkdir android-src
          unzip -q android-project.zip -d android-src
          test -f android-src/settings.gradle
          test -f android-src/app/build.gradle

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Localizar sdkmanager
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER_PATH="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "::error::sdkmanager não encontrado dentro de $ANDROID_SDK_ROOT/cmdline-tools"
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          chmod +x "$SDKMANAGER_PATH"
          echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"
          "$SDKMANAGER_PATH" --version

      - name: Instalar Android 16 / API 36
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validar segredos de assinatura
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Falta o secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Falta o secret ANDROID_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Falta o secret ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Falta o secret ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Recriar chave privada somente no servidor de build
        working-directory: android-src
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > upload-key.jks
          cat > keystore.properties <<EOF
          storeFile=upload-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Compilar AAB assinado e APK de teste
        working-directory: android-src
        shell: bash
        run: |
          gradle --no-daemon --stacktrace bundleRelease assembleRelease

      - name: Conferir AAB gerado
        working-directory: android-src
        shell: bash
        run: |
          test -f app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Enviar AAB para download
        uses: actions/upload-artifact@v4
        with:
          name: BibliaEmProfundidade-PlayStore-AAB
          path: android-src/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Enviar APK de teste para download
        uses: actions/upload-artifact@v4
        with:
          name: BibliaEmProfundidade-Teste-APK
          path: android-src/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
